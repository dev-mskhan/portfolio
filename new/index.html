<!doctype html>
<html lang="en" class="bg-background">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/portfolio.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111512" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Muhammad Shahzaib, Full Stack Developer specializing in MERN and Agentic AI systems. Building intelligent, production-grade software."
    />
    <title>Muhammad Shahzaib, Full Stack &amp; Agentic AI Developer</title>
    <script>
      const storedTheme = localStorage.getItem("theme");
      const storedPalette = localStorage.getItem("palette");
      if (storedTheme === "light") document.documentElement.classList.add("light");
      if (storedTheme === "light" || storedTheme === "dark") {
        document.documentElement.dataset.theme = storedTheme;
      }
      if (["forest", "ocean", "plum", "amber"].includes(storedPalette)) {
        document.documentElement.dataset.palette = storedPalette;
      }
      if (window.location.pathname === "/") {
        const portrait = document.createElement("link");
        portrait.rel = "preload";
        portrait.as = "image";
        portrait.href = "/images/profile-pic.jpg";
        portrait.setAttribute("fetchpriority", "high");
        document.head.append(portrait);
      }
    </script>
  </head>
  <body>
    <!--
      THESIS: A developer portfolio where the real project artifact leads, replacing the standard code-card hero.
      OWN-WORLD: Ink-green surfaces, mineral-lime highlights, spacious type, and restrained machined frames for genuine project imagery.
      STORY: Hiring teams and prospective clients can scan capabilities, inspect project decisions, and contact the developer.
      FIRST VIEWPORT: Wide asymmetric split, name and direct actions on the left, a real marketplace screenshot with subtle perspective on the right.
      FORM: Artistic asymmetry, chosen from the explicit brief; Python RNG and concept-seed execution were blocked by environment permissions, so no seeded assignment is claimed.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
